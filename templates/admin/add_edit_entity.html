{% extends "base.html" %}
{% block content %}
{% if mode=="add" %}
<h2>Add Club or Office</h2>
<form action="{{ url_for('admin.add_entity') }}" method="post">
  <label>Type
    <select name="entity_type">
      <option value="club">Club</option>
      <option value="office">Office</option>
    </select>
  </label>
  <div>
    <label>Name<input name="name" required></label>
  </div>
  <div>
    <label>Description<textarea name="description"></textarea></label>
  </div>
  <div>
    <label>Category (clubs)<input name="category"></label>
  </div>
  <button type="submit">Create</button>
  <a href="{{ url_for('admin.dashboard') }}">Cancel</a>
</form>
{% else %}
<h2>Edit {{ entity.title() }}</h2>
<form action="{{ url_for('admin.edit_entity', entity=entity, entity_id=item.id) }}" method="post">
  <div>
    <label>Name<input name="name" value="{{ item.name }}" required></label>
  </div>
  <div>
    <label>Description<textarea name="description">{{ item.description }}</textarea></label>
  </div>
  {% if entity=="club" %}
  <div>
    <label>Category<input name="category" value="{{ item.category }}"></label>
  </div>
  {% endif %}
  <button type="submit">Save</button>
  <a href="{{ url_for('admin.dashboard') }}">Cancel</a>
</form>
{% endif %}
{% endblock %}
