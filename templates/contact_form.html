{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Send Message</h2>
    
    <form method="POST">
        <label>To (Email):</label>
        <input type="text" name="receiver" class="form-control" placeholder="Enter email" required>
        <br>

        <label>Message:</label>
        <textarea name="content" class="form-control" rows="3" required></textarea>
        <br>

        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
{% endblock %}
